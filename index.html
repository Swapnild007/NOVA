<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="NOVA">
  <title>NOVA</title>
  <style>
    :root{
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
      color:#f5f5f7;
      background:#050506;
      font-synthesis:none;
      text-rendering:optimizeLegibility;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{min-height:100svh;overflow:hidden;background:#050506}
    .splash{
      position:relative;
      display:grid;
      min-height:100svh;
      place-items:center;
      isolation:isolate;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 43%,rgba(112,126,155,.12),transparent 23%),
        radial-gradient(circle at 50% 50%,rgba(255,255,255,.035),transparent 46%),
        #050506;
    }
    .identity{
      position:relative;
      z-index:3;
      display:flex;
      flex-direction:column;
      align-items:center;
      transform:translateY(-1vh);
    }
    .core{
      position:relative;
      width:clamp(112px,25vw,164px);
      aspect-ratio:1;
      display:grid;
      place-items:center;
      animation:arrival 1.25s cubic-bezier(.16,1,.3,1) both;
    }
    .core__halo{
      position:absolute;
      inset:-28%;
      border-radius:50%;
      background:radial-gradient(circle,rgba(181,195,222,.13),rgba(181,195,222,0) 68%);
      filter:blur(10px);
      animation:breathe 3.6s ease-in-out infinite;
    }
    .core__ring{position:absolute;border:1px solid rgba(255,255,255,.18);border-radius:50%}
    .core__ring--outer{
      inset:5%;
      box-shadow:0 0 50px rgba(180,193,220,.07),inset 0 0 35px rgba(255,255,255,.025);
      animation:orbit 8s linear infinite;
    }
    .core__ring--inner{
      inset:20%;
      border-color:rgba(255,255,255,.28);
      border-top-color:rgba(216,225,242,.75);
      border-right-color:rgba(216,225,242,.42);
      animation:orbitReverse 5.5s linear infinite;
    }
    .core__light{
      width:27%;
      aspect-ratio:1;
      border-radius:50%;
      background:radial-gradient(circle at 38% 34%,#fff 0,#e9edf5 28%,#9ba8be 62%,#526076 100%);
      box-shadow:0 0 18px rgba(218,225,239,.42),0 0 60px rgba(130,148,182,.2);
      animation:pulse 2.8s ease-in-out infinite;
    }
    .wordmark{
      margin-top:38px;
      font-size:clamp(30px,7vw,44px);
      font-weight:600;
      letter-spacing:.23em;
      padding-left:.23em;
      color:#f5f5f7;
      text-shadow:0 1px 24px rgba(255,255,255,.07);
      animation:wordmark 1s .25s cubic-bezier(.22,1,.36,1) both;
    }
    .status{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:16px;
      color:rgba(245,245,247,.48);
      font-size:12px;
      letter-spacing:.015em;
      animation:status 1s .55s cubic-bezier(.22,1,.36,1) both;
    }
    .status__dot{
      width:5px;height:5px;border-radius:50%;
      background:#c9d4e7;
      box-shadow:0 0 10px rgba(201,212,231,.55);
    }
    .ambient{
      position:absolute;
      z-index:0;
      width:45vw;height:45vw;
      min-width:300px;min-height:300px;
      border-radius:50%;
      filter:blur(70px);
      opacity:.18;
      pointer-events:none;
    }
    .ambient--one{
      top:-20%;left:-15%;
      background:#26334c;
      animation:driftOne 14s ease-in-out infinite alternate;
    }
    .ambient--two{
      right:-18%;bottom:-24%;
      background:#39465e;
      animation:driftTwo 17s ease-in-out infinite alternate;
    }
    .edge-glow{
      position:absolute;
      inset:auto 0 0;
      height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
      opacity:.55;
    }
    @keyframes arrival{
      from{opacity:0;transform:scale(.78);filter:blur(10px)}
      to{opacity:1;transform:scale(1);filter:blur(0)}
    }
    @keyframes wordmark{
      from{opacity:0;transform:translateY(12px);letter-spacing:.38em}
      to{opacity:1;transform:translateY(0);letter-spacing:.23em}
    }
    @keyframes status{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes breathe{
      0%,100%{transform:scale(.92);opacity:.7}
      50%{transform:scale(1.08);opacity:1}
    }
    @keyframes pulse{
      0%,100%{transform:scale(.92)}
      50%{transform:scale(1.06)}
    }
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes orbitReverse{to{transform:rotate(-360deg)}}
    @keyframes driftOne{to{transform:translate(18vw,10vh) scale(1.15)}}
    @keyframes driftTwo{to{transform:translate(-16vw,-8vh) scale(1.12)}}
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
    }
    @media(max-width:480px){
      .wordmark{margin-top:30px}
      .status{margin-top:13px}
    }
  </style>
</head>
<body>
  <main class="splash" aria-label="NOVA">
    <div class="ambient ambient--one"></div>
    <div class="ambient ambient--two"></div>

    <section class="identity">
      <div class="core" aria-hidden="true">
        <div class="core__halo"></div>
        <div class="core__ring core__ring--outer"></div>
        <div class="core__ring core__ring--inner"></div>
        <div class="core__light"></div>
      </div>
      <div class="wordmark">NOVA</div>
      <div class="status"><span class="status__dot"></span>Ready when you are</div>
    </section>

    <div class="edge-glow"></div>
  </main>

</body>
</html>
