<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>NOVA</title>
<style>
:root{--bg:#f4f5f7;--ink:#111318;--muted:#777c85;--line:#11131814;--glass:#ffffffb5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
body{min-height:100svh}.shell{min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% -8%,#fff 0,transparent 42%),radial-gradient(circle at 100% 70%,#dfe4ee88,transparent 36%),linear-gradient(145deg,#fafbfc,#eef0f4)}
.shell:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#1418200a .6px,transparent .6px);background-size:5px 5px;pointer-events:none}
.intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#f7f8fa;transition:opacity .6s ease,transform .6s ease}.intro.out{opacity:0;pointer-events:none;transform:scale(1.015)}
.nmark{font-size:clamp(80px,18vw,150px);font-weight:700;letter-spacing:-.09em;animation:in .7s ease both}.nname{position:absolute;margin-top:210px;font-size:11px;letter-spacing:.42em;padding-left:.42em;color:#555a63;animation:in .7s .08s ease both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.top{height:76px;padding:0 clamp(18px,5vw,64px);display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}.brand{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.16em;font-weight:700}.mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#17191f;color:white;font-size:12px;box-shadow:0 8px 20px #0002}.menu{width:38px;height:38px;border:0;border-radius:50%;background:#fff8;color:#656a73;font-size:17px}
main{width:min(980px,calc(100% - 32px));min-height:calc(100svh - 126px);margin:auto;display:flex;flex-direction:column;justify-content:center;padding:40px 0 80px;position:relative;z-index:1}.eyebrow{font-size:10px;letter-spacing:.25em;font-weight:700;color:#858a94}.hero h1{font-size:clamp(44px,7vw,78px);line-height:.98;letter-spacing:-.065em;font-weight:650;margin:18px 0 20px}.hero p{font-size:clamp(15px,2vw,18px);line-height:1.55;color:var(--muted);max-width:550px;margin:0 0 30px}
.chat{display:none;max-height:42vh;overflow:auto;margin-bottom:14px}.bubble{max-width:720px;padding:17px 20px;border-radius:21px;margin:10px 0;line-height:1.6;font-size:15px}.you{margin-left:auto;background:#17191f;color:white}.nova{background:#ffffffb5;border:1px solid var(--line);backdrop-filter:blur(20px)}.label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.55;font-weight:700;margin-bottom:7px}
.composer{padding:10px;border:1px solid var(--line);border-radius:27px;background:#ffffffe0;box-shadow:0 24px 80px #181c2619;backdrop-filter:blur(28px)}textarea{display:block;width:100%;min-height:74px;resize:none;border:0;outline:0;background:transparent;padding:14px 16px 5px;font-size:17px;line-height:1.5;color:var(--ink)}textarea::placeholder{color:#9a9ea6}.bottom{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 2px 8px}.context{font-size:12px;color:#858a93}.send{width:42px;height:42px;border:0;border-radius:50%;background:#17191f;color:white;font-size:20px}.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.chip{border:1px solid var(--line);border-radius:999px;background:#ffffff73;padding:10px 15px;color:#555a63;font-size:12px}.foot{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:24px;color:#9a9ea6;font-size:10px;letter-spacing:.08em}
@media(max-width:640px){.top{height:66px}main{width:calc(100% - 22px);padding-top:25px}.hero h1{font-size:48px}.hero p{font-size:14px}.composer{border-radius:23px}.foot{flex-direction:column;align-items:center;gap:8px}.nname{margin-top:175px}}
</style>
</head>
<body>
<div class="shell">
<div class="intro" id="intro"><div class="nmark">N</div><div class="nname">NOVA</div></div>
<header class="top"><div class="brand"><span class="mark">N</span><span>NOVA</span></div><button class="menu">•••</button></header>
<main>
<section class="hero"><span class="eyebrow">INTELLIGENCE, CONNECTED</span><h1>What are we<br>working on?</h1><p>Think, create, research, analyze and act from one place.</p></section>
<section class="chat" id="chat"></section>
<form class="composer" id="form"><textarea id="input" placeholder="Ask NOVA anything..." autocomplete="off"></textarea><div class="bottom"><span class="context">＋ Context</span><button class="send" aria-label="Send">↑</button></div></form>
<div class="chips"><button class="chip" data-prompt="Research something for me">Research</button><button class="chip" data-prompt="Help me create something">Create</button><button class="chip" data-prompt="Analyze this for me">Analyze</button><button class="chip" data-prompt="Help me build something">Build</button></div>
</main>
<footer class="foot"><span>One intelligence layer.</span><span>Private by design.</span></footer>
</div>
<script>
const intro=document.getElementById("intro"),form=document.getElementById("form"),input=document.getElementById("input"),chat=document.getElementById("chat");
setTimeout(()=>intro.classList.add("out"),950);
function send(text){text=text.trim();if(!text)return;chat.style.display="block";chat.insertAdjacentHTML("beforeend",'<div class="bubble you"><div class="label">You</div>'+escapeHtml(text)+'</div>');input.value="";setTimeout(()=>{chat.insertAdjacentHTML("beforeend",'<div class="bubble nova"><div class="label">NOVA</div>I’m ready to work on “'+escapeHtml(text)+'”. The product surface is live. Real model routing, tools, files and memory are the next intelligence layer.</div>');chat.scrollTop=chat.scrollHeight},280)}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
form.addEventListener("submit",e=>{e.preventDefault();send(input.value)});
document.querySelectorAll("[data-prompt]").forEach(b=>b.addEventListener("click",()=>{input.value=b.dataset.prompt;input.focus()}));
</script>
</body>
</html>
